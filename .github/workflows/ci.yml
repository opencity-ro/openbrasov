name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # The only check a pull request waits on, so it has to stay quick.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Release pull requests only carry a version bump, a changelog entry and the
      # manifest, all written by a bot. Linting them proves nothing, so the job
      # reports success immediately and the release publishes without the wait.
      - id: gate
        run: |
          if [[ "${{ github.head_ref }}" == release-please--* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Release pull request: skipping the source checks."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # corepack reads packageManager from package.json, which drops a separate
      # action and lets setup-node restore the pnpm store in the same pass.
      - if: steps.gate.outputs.run == 'true'
        run: corepack enable

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache the Next build
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - if: steps.gate.outputs.run == 'true'
        run: pnpm lint

      - if: steps.gate.outputs.run == 'true'
        run: pnpm format:check

      - if: steps.gate.outputs.run == 'true'
        run: pnpm typecheck

      - if: steps.gate.outputs.run == 'true'
        run: pnpm test

      - if: steps.gate.outputs.run == 'true'
        run: pnpm build

  # A real browser with WebGL is the only place the map can be proven to render,
  # so this stays — just off the critical path. It runs after a merge, ahead of
  # anything reaching production, and never blocks a pull request or a release.
  e2e:
    name: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
