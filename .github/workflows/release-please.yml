name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A push made with the default GITHUB_TOKEN never starts another
          # workflow run, so merging the release PR with it leaves the release
          # itself unpublished. RELEASE_TOKEN (a personal access token) makes the
          # merge commit trigger this workflow again, which then tags the release.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Release PRs only bump the version, the manifest and the changelog, so they
      # merge themselves. Auto-merge waits for the required checks; if the repo has
      # none configured yet, GitHub rejects --auto and we merge straight away.
      - name: Merge the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          NUMBER=$(jq -r '.[0].number' <<< "$PRS")
          echo "Release PR: #$NUMBER"
          gh pr merge "$NUMBER" --squash --auto --repo "$GITHUB_REPOSITORY" \
            || gh pr merge "$NUMBER" --squash --repo "$GITHUB_REPOSITORY"
